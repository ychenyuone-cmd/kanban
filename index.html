<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景甜 · 内蒙古特产 · 拼多多运营</title>
<style>
:root{--green:#00b451;--green-dark:#009940;--green-light:#e6f7ec;--text:#333;--text-light:#707070;--text-muted:#999;--bg:#f8faf8;--card:#fff;--border:#e8e8e0;--shadow:0 2px 16px rgba(0,180,81,0.08);--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:10px}.brand .logo{font-size:24px}
.brand .txt h1{font-size:18px;font-weight:600}.brand .txt h1 span{color:var(--green)}
.brand .txt small{font-size:11px;color:var(--text-light);display:block;margin-top:-1px}
.header-nav{display:flex;align-items:center;gap:8px}
.btn-out{background:transparent;color:var(--text-light);border:1px solid var(--border);padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s;font-family:inherit}
.btn-out:hover{border-color:var(--green);color:var(--green)}
.main{max-width:1200px;margin:0 auto;padding:20px 24px 40px}

/* 总进度 */
.overall{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin-bottom:20px}
.overall-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.overall-title{font-size:15px;font-weight:600}.overall-title span{color:var(--green)}
.overall-pct{font-size:28px;font-weight:700;color:var(--green);line-height:1}
.overall-bar{height:8px;background:#e8e8e0;border-radius:4px;overflow:hidden;margin-bottom:10px}
.overall-bar .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green-light),var(--green));transition:width .8s ease;position:relative}
.overall-bar .fill::after{content:'';position:absolute;top:0;right:0;width:20px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));border-radius:0 4px 4px 0}
.overall-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-light)}
.overall-meta .info{display:flex;gap:16px;flex-wrap:wrap}

.stats-row{display:flex;gap:12px;margin-bottom:20px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px;flex:1;min-width:0;transition:.2s}
.stat-box:hover{border-color:var(--green);box-shadow:var(--shadow)}
.stat-box .num{font-size:26px;font-weight:700}.stat-box .label{font-size:12px;color:var(--text-light);margin-top:2px}
.stat-box.s1 .num{color:var(--green)}.stat-box.s2 .num{color:#e67e22}.stat-box.s3 .num{color:#2980b9}.stat-box.s4 .num{color:var(--text-muted)}

.phase-bar{display:flex;gap:0;margin-bottom:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.phase-item{flex:1;padding:14px 12px;text-align:center;cursor:pointer;transition:.2s;position:relative;border-right:1px solid var(--border)}
.phase-item:last-child{border-right:none}
.phase-item:hover{background:var(--green-light)}.phase-item.active{background:var(--green-light)}
.phase-item.active::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--green);border-radius:3px 3px 0 0}
.phase-item .icon{font-size:20px}.phase-item .name{font-size:13px;font-weight:500;margin-top:4px}
.phase-item .meta{font-size:11px;color:var(--text-light);margin-top:2px}
.phase-item .mini-bar{height:3px;background:#e8e8e0;border-radius:2px;margin-top:6px;overflow:hidden}
.phase-item .mini-bar .mf{height:100%;border-radius:2px;transition:width .5s}

.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.column{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.col-header{padding:12px 16px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.col-header .num{font-size:11px;color:var(--text-muted);font-weight:400}
.col-body{padding:8px;min-height:80px}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(0,180,81,.06)}
.card .title{font-size:13px;font-weight:500;line-height:1.4}
.card .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.card .tag{font-size:10px;padding:2px 8px;border-radius:4px;background:#f5f5f0;color:var(--text-light)}
.card .tag.green{background:var(--green-light);color:var(--green)}.card .tag.gray{background:#f0f0ec;color:var(--text-muted)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.modal .mh{font-size:17px;font-weight:600;margin-bottom:2px}
.modal .ms{font-size:12px;color:var(--text-light);margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:500;margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;font-family:inherit;background:#fafcfa;transition:.2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(0,180,81,.06)}
.modal textarea{resize:vertical;min-height:50px}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-row button{flex:1;padding:10px;border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;font-weight:500}
.btn-primary{background:var(--green);color:#fff}.btn-primary:hover{background:var(--green-dark)}
.btn-danger{background:#fff2f2;color:#c0392b;border:1px solid #fdd}
.btn-ghost{background:#f5f5f0;color:var(--text)}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0eb}
.sub-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);cursor:pointer}
.sub-row .st{flex:1;font-size:12px}.sub-row .st.done{text-decoration:line-through;color:var(--text-muted)}
.sub-row .ri{flex:1;padding:4px 8px;border:none;border-bottom:1px dashed #ddd;background:transparent;font-size:11px;outline:none;transition:.2s}
.sub-row .ri:focus{border-bottom-color:var(--green)}.sub-row .ri::placeholder{color:#ccc}

@media(max-width:768px){.board{grid-template-columns:1fr}.stats-row{flex-wrap:wrap}.stat-box{min-width:100px}.phase-bar{flex-wrap:wrap}.phase-item{min-width:80px;border-bottom:1px solid var(--border)}.overall{padding:18px 20px}.overall-pct{font-size:22px}}
</style>
</head><body>

<header><div class="header-inner">
<div class="brand"><span class="logo">🐐</span><div class="txt"><h1>景甜 · <span>内蒙古特产</span></h1><small>拼多多电商运营</small></div></div>
<div class="header-nav">
<span class="btn-out" onclick="ex()">📥 导出</span>
<span class="btn-out" onclick="document.getElementById('imF').click()">📤 导入</span>
<input type="file" id="imF" accept=".json" style="display:none" onchange="im(event)">
</div></div></header>

<div class="main">

<div class="overall">
<div class="overall-top">
<div class="overall-title">📈 项目总进度 <span id="opT">0%</span></div>
<div class="overall-pct" id="opN">0%</div></div>
<div class="overall-bar"><div class="fill" id="obF" style="width:0%"></div></div>
<div class="overall-meta">
<div class="info"><span id="oT">📋 0个任务</span><span id="oD">✅ 0已完成</span><span id="oP">📊 0/6阶段</span></div>
<div class="info"><span id="oDt">📅 项目进行中</span></div></div></div>

<div class="stats-row" id="sR"></div>
<div class="phase-bar" id="pB"></div>

<div class="board">
<div class="column"><div class="col-header"><span style="color:var(--green)">●</span> 待办 <span class="num" id="tc">0</span><span style="margin-left:auto;cursor:pointer;font-size:16px;color:var(--green);font-weight:400" onclick="addTask('todo')">+</span></div><div class="col-body" id="cT"></div></div>
<div class="column"><div class="col-header"><span style="color:#e67e22">●</span> 进行中 <span class="num" id="dc">0</span><span style="margin-left:auto;cursor:pointer;font-size:16px;color:#e67e22;font-weight:400" onclick="addTask('doing')">+</span></div><div class="col-body" id="cD"></div></div>
<div class="column"><div class="col-header"><span style="color:#2980b9">●</span> 已完成 <span class="num" id="nc">0</span><span style="margin-left:auto;cursor:pointer;font-size:16px;color:#2980b9;font-weight:400" onclick="addTask('done')">+</span></div><div class="col-body" id="cN"></div></div>
</div></div>

<div class="modal-overlay" id="mO"><div class="modal">
<div class="mh" id="mT">任务</div><div class="ms" id="mS"></div>
<label>任务名称</label><input id="eN">
<label>状态</label><select id="eS"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select>
<label>阶段</label><select id="eP"></select>
<label>备注</label><textarea id="eNo"></textarea>
<label>规划完成时间</label><input id="eD" type="date">
<label>子任务</label><div id="sL"></div>
<div class="btn-row">
<button class="btn-primary" onclick="svTask()">💾 保存</button>
<button class="btn-danger" onclick="dl()">🗑 删除</button>
<button class="btn-ghost" onclick="cm()">取消</button>
</div></div></div>

<script>
// 硬编码默认数据 - 包含之前确认的所有信息
const DEF={
  tasks:[
    {id:"t1",title:"准备注册资料",phase:"准备",status:"done",note:"身份证已拍照、手机号182xxx、工行卡已准备",subs:[{text:"身份证拍照",done:true,result:"已拍照"},{text:"手机号验证",done:true,result:"182xxx"},{text:"银行卡准备",done:true,result:"工行卡已准备"},{text:"备用店名确认",done:true,result:"原上草集"}]},
    {id:"t2",title:"安装Python环境",phase:"准备",status:"done",note:"Python 3.11.5 + pillow/rembg",subs:[{text:"安装Python",done:true,result:"3.11.5"},{text:"安装pillow",done:true,result:"已安装"},{text:"测试通过",done:true,result:"ok"}]},
    {id:"t3",title:"逛1688找供应商",phase:"选品",status:"doing",note:"找牛肉干/奶制品供应商",subs:[{text:"搜索牛肉干",done:true,result:"已搜索3家"},{text:"搜索奶制品",done:false},{text:"对比价格",done:false},{text:"联系询价",done:false}]},
    {id:"t4",title:"确定选品清单",phase:"选品",status:"todo",note:"",subs:[]},
    {id:"t5",title:"下载原图素材",phase:"素材",status:"todo",note:"从供应商拿图",subs:[]},
    {id:"t6",title:"设计Logo与品牌色",phase:"素材",status:"todo",note:"",subs:[]},
    {id:"t7",title:"注册拼多多店铺",phase:"注册",status:"todo",note:"商标: 原上草集",subs:[]},
    {id:"t8",title:"上传商品",phase:"上架",status:"todo",note:"",subs:[]},
    {id:"t9",title:"编写商品详情页",phase:"上架",status:"todo",note:"",subs:[]},
    {id:"t10",title:"配置客服话术",phase:"客服",status:"todo",note:"",subs:[]},
    {id:"t11",title:"运营推广",phase:"运营",status:"todo",note:"内容运营/社交推广",subs:[{text:"内容规划",done:false},{text:"社交推广",done:false}]}
  ],
  startDate:"2026-04-24",
  targetDate:"2026-05-15"
};

// localStorage: 用 mg_kanban
const STORAGE_KEY="mg_kanban";

// 加载: 简单直接
function ld(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(d && d.tasks && Array.isArray(d.tasks) && d.tasks.length>0){
        return d;
      }
    }
  }catch(e){/*忽略*/}
  // 没有有效数据，保存默认并返回
  const cpy=JSON.parse(JSON.stringify(DEF));
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(cpy))}catch(e){}
  return cpy;
}

let data=ld();

function sv(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(e){}
  rn();
}

const PHASES=["准备","注册","选品","素材","上架","客服"];
const PI=["📋","📝","🔍","🎨","🚀","💬"];
const PC=["#5B9BD5","#A78BDB","#D4835A","#C86A6A","#7DB356","#C58B5C"];
let eid=null,af=null;

function ex(){
  const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b);
  a.download="内蒙古特产看板.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function im(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{try{data=JSON.parse(ev.target.result);sv()}catch{alert("导入失败")}};
  r.readAsText(f);
}

function co(){
  const t=data.tasks;
  const total=t.length,done=t.filter(x=>x.status==="done").length;
  const taskPct=total?Math.round(done/total*100):0;
  const phasesDone=PHASES.reduce((c,p)=>{const pt=t.filter(x=>x.phase===p);return c+(pt.length&&pt.every(x=>x.status==="done")?1:0)},0);
  const phasePct=Math.round(phasesDone/PHASES.length*100);
  const sd=data.startDate||"2026-04-24",td=data.targetDate||"2026-05-15";
  const s=new Date(sd),e=new Date(td),n=new Date();
  const totalDays=Math.max(1,(e-s)/864e5);
  const elapsed=Math.max(0,Math.min(totalDays,(n-s)/864e5));
  const datePct=Math.round(elapsed/totalDays*100);
  const pct=Math.round(taskPct*0.4+phasePct*0.4+datePct*0.2);
  return{pct,total,done,phasesDone,totalPhases:PHASES.length,sd,td,elapsed:Math.round(elapsed),totalDays:Math.round(totalDays)}
}

function rn(){
  const o=co();
  document.getElementById("opT").textContent=o.pct+"%";
  document.getElementById("opN").textContent=o.pct+"%";
  document.getElementById("obF").style.width=o.pct+"%";
  document.getElementById("oT").innerHTML="📋 "+o.total+"个任务";
  document.getElementById("oD").innerHTML="✅ "+o.done+"已完成";
  document.getElementById("oP").innerHTML="📊 "+o.phasesDone+"/"+o.totalPhases+"阶段";
  document.getElementById("oDt").innerHTML="📅 "+o.sd+" → "+o.td+"（第"+o.elapsed+"/"+o.totalDays+"天）";
  
  const t=data.tasks;
  const tod=t.filter(x=>x.status==="todo").length;
  const doi=t.filter(x=>x.status==="doing").length;
  const don=t.filter(x=>x.status==="done").length;
  document.getElementById("sR").innerHTML=
    '<div class="stat-box s2"><div class="num">'+tod+'</div><div class="label">待办</div></div>'+
    '<div class="stat-box s1"><div class="num">'+doi+'</div><div class="label">进行中</div></div>'+
    '<div class="stat-box s3"><div class="num">'+don+'</div><div class="label">已完成</div></div>'+
    '<div class="stat-box s4"><div class="num">'+t.length+'</div><div class="label">总计</div></div>';
  
  document.getElementById("pB").innerHTML=PHASES.map((p,i)=>{
    const pt=t.filter(x=>x.phase===p),d=pt.filter(x=>x.status==="done").length,tl=pt.length;
    const pct=tl?Math.round(d/tl*100):0;
    return '<div class="phase-item'+(af===p?' active':'')+'" onclick="fp(\''+p+'\')">'+
      '<div class="icon">'+PI[i]+'</div>'+
      '<div class="name">'+p+'</div>'+
      '<div class="meta">'+d+'/'+tl+'</div>'+
      '<div class="mini-bar"><div class="mf" style="width:'+pct+'%;background:'+PC[i]+'"></div></div></div>';
  }).join("");
  rc();
}

function rc(){
  const t=data.tasks;
  const fi=af?t.filter(x=>x.phase===af):t;
  ["todo","doing","done"].forEach(st=>{
    const el=document.getElementById({todo:"cT",doing:"cD",done:"cN"}[st]);
    const items=fi.filter(x=>x.status===st);
    el.innerHTML=items.map(x=>{
      const sdc=x.subs.filter(s=>s.done).length,sdl=x.subs.length;
      let tags='<span class="tag">'+x.phase+'</span>';
      if(sdl)tags+='<span class="tag green">✓'+sdc+'/'+sdl+'</span>';
      return '<div class="card" onclick="ot(\''+x.id+'\')"><div class="title">'+es(x.title)+'</div><div class="tags">'+tags+(x.dueDate?'<span class="tag">📅'+x.dueDate+'</span>':'')+'</div></div>';
    }).join("");
  });
  document.getElementById("tc").textContent=fi.filter(x=>x.status==="todo").length;
  document.getElementById("dc").textContent=fi.filter(x=>x.status==="doing").length;
  document.getElementById("nc").textContent=fi.filter(x=>x.status==="done").length;
}

function fp(p){
  document.querySelectorAll(".phase-item").forEach(el=>el.classList.remove("active"));
  af=(af===p)?null:p;
  if(af){document.querySelectorAll(".phase-item").forEach(el=>{if(el.textContent.includes(p))el.classList.add("active")})}
  rc();
}

function ot(id){
  const t=data.tasks.find(x=>x.id===id);if(!t)return;eid=id;
  document.getElementById("mT").textContent=t.title;
  document.getElementById("eN").value=t.title;
  document.getElementById("eS").value=t.status;
  document.getElementById("eP").innerHTML=PHASES.map(p=>'<option value="'+p+'"'+(p===t.phase?'selected':'')+'>'+p+'</option>').join("");
  document.getElementById("eNo").value=t.note||"";
  document.getElementById("eD").value=t.dueDate||new Date().toISOString().slice(0,10);
  const sdc=t.subs.filter(s=>s.done).length,sdl=t.subs.length;
  document.getElementById("mS").textContent=t.phase+(sdl?" · 子任务 "+sdc+"/"+sdl:"");
  const sl=document.getElementById("sL");
  const subAddHtml='<div style="display:flex;gap:6px;margin-top:6px">'+
    '<input id="nSI_'+id+'" placeholder="新增子任务…" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none">'+
    '<button onclick="as(\''+id+'\')" style="border:none;background:var(--green);color:#fff;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit">+ 添加</button></div>';
  if(t.subs&&t.subs.length){
    sl.innerHTML=t.subs.map((s,i)=>
      '<div class="sub-row"><input type="checkbox"'+(s.done?" checked":"")+' onchange="ts('+i+')">'+
      '<span class="st'+(s.done?" done":"")+'">'+es(s.text)+'</span>'+
      '<input class="ri" value="'+es(s.result||"")+'" placeholder="结果" onchange="sr('+i+',this.value)">'+
      '<span onclick="ds('+i+')" style="color:#aaa;cursor:pointer;font-size:16px;line-height:1">×</span></div>'
    ).join("");
    sl.innerHTML+=subAddHtml;
  }else{
    t.subs=[];
    sl.innerHTML=subAddHtml;
  }
  document.getElementById("mO").classList.add("show");
}

function cm(){document.getElementById("mO").classList.remove("show");rn();eid=null}
function as(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;const inp=document.getElementById("nSI_"+id);const txt=inp?(inp.value.trim()):"";if(!txt)return;if(!t.subs)t.subs=[];t.subs.push({text:txt,done:false,result:""});sv();ot(id)}
function ds(i){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.subs.splice(i,1);sv();ot(eid)}
function ts(i){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.subs[i].done=!t.subs[i].done;sv();ot(eid)}
function sr(i,v){const t=data.tasks.find(x=>x.id===eid);if(!t)return;if(!t.subs[i].result)t.subs[i].result="";t.subs[i].result=v;sv()}
function svTask(){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.title=document.getElementById("eN").value.trim()||t.title;t.status=document.getElementById("eS").value;t.phase=document.getElementById("eP").value;t.note=document.getElementById("eNo").value;t.dueDate=document.getElementById("eD").value;sv();cm()}
function dl(){if(!confirm("确定删除此任务？"))return;data.tasks=data.tasks.filter(t=>t.id!==eid);sv();cm()}
function addTask(status){
  const ids=data.tasks.map(t=>{const n=parseInt(t.id.replace("t",""));return isNaN(n)?0:n});
  const nextId=Math.max(0,...ids)+1;
