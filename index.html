<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐐 景甜 · 内蒙古特产</title>
<style>
:root {
  --sky-top: #c1e1f5;
  --grass-mid: #ddeec0;
  --grass-bottom: #b6d79e;
  --grass-deep: #8bc07a;
  --text-dark: #1a3a1a;
  --text-muted: #7aa87a;
  --card-bg: rgba(255,255,255,0.88);
  --card-border: rgba(92,170,78,0.12);
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --radius: 14px;
  --accent: #3B8B2E;
  --accent2: #5CAA4E;
  --orange: #D4835A;
  --blue: #5B9BD5;
  --purple: #A78BDB;
  --red: #C86A6A;
  --teal: #5BA89E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--grass-mid) 35%,var(--grass-bottom) 65%,var(--grass-deep) 100%);
  color:var(--text-dark);background-attachment:fixed
}
.animals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.07;font-size:60px}
.animals span{position:absolute;animation:float 20s infinite ease-in-out}
.animals span:nth-child(1){top:5%;left:3%;animation-delay:0s}
.animals span:nth-child(2){top:12%;right:8%;animation-delay:-3s;font-size:40px}
.animals span:nth-child(3){top:30%;left:5%;animation-delay:-7s;font-size:50px}
.animals span:nth-child(4){top:45%;right:3%;animation-delay:-11s;font-size:70px}
.animals span:nth-child(5){bottom:20%;left:8%;animation-delay:-5s;font-size:45px}
.animals span:nth-child(6){bottom:10%;right:5%;animation-delay:-9s;font-size:55px}
.animals span:nth-child(7){top:60%;left:2%;animation-delay:-14s;font-size:35px}
.animals span:nth-child(8){bottom:30%;right:10%;animation-delay:-2s;font-size:48px}
@keyframes float{
  0%,100%{transform:translateY(0)rotate(0deg)}
  25%{transform:translateY(-15px)rotate(3deg)}
  50%{transform:translateY(5px)rotate(-2deg)}
  75%{transform:translateY(-8px)rotate(2deg)}
}
header{
  background:rgba(26,58,26,.85);backdrop-filter:blur(12px);
  color:#fff;padding:16px 24px;position:sticky;top:0;z-index:100;
  border-bottom:1px solid rgba(255,255,255,.06)
}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:28px}
.brand .txt h1{font-size:20px;font-weight:700;letter-spacing:1px}
.brand .txt small{font-size:11px;color:#7aa87a;display:block;margin-top:-2px}
.header-info{display:flex;align-items:center;gap:10px;font-size:12px}
.header-info .badge{background:rgba(255,255,255,.08);padding:4px 10px;border-radius:20px;font-size:11px;color:#b6d79e}
.header-info .badge.approval{background:var(--orange);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.btn-hdr{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#ddeec0;padding:5px 12px;border-radius:8px;cursor:pointer;font-size:11px;transition:.2s}
.btn-hdr:hover{background:rgba(255,255,255,.15);color:#fff}
.stats-bar{max-width:1200px;margin:0 auto;padding:16px 24px 12px;display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.stat-card{background:var(--card-bg);border-radius:var(--radius);padding:12px 16px;flex:1;min-width:90px;box-shadow:var(--shadow);text-align:center;backdrop-filter:blur(8px);border:1px solid var(--card-border)}
.stat-card .num{font-size:22px;font-weight:700}
.stat-card .label{font-size:11px;color:var(--text-muted);margin-top:1px}
.stat-card.c1 .num{color:var(--blue)}
.stat-card.c2 .num{color:var(--orange)}
.stat-card.c3 .num{color:var(--accent)}
.stat-card.c4 .num{color:var(--teal)}
.flow-container{max-width:1200px;margin:0 auto;padding:0 24px 16px;position:relative;z-index:1}
.phase-flow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.phase-item{flex:1;min-width:100px;background:var(--card-bg);backdrop-filter:blur(8px);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.phase-item:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}
.phase-item.active{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(92,170,78,.15)}
.phase-item .pbg{position:absolute;bottom:0;left:0;height:100%;opacity:.06;border-radius:12px;transition:width .5s}
.phase-item .name{font-size:13px;font-weight:600;position:relative}
.phase-item .progress{margin-top:6px;display:flex;align-items:center;gap:8px;position:relative}
.phase-item .bar{flex:1;height:4px;background:#ddd;border-radius:2px;overflow:hidden}
.phase-item .bar .fill{height:100%;border-radius:2px;transition:width .5s}
.phase-item .pct{font-size:11px;color:var(--text-muted)}
.phase-item .count{font-size:10px;color:var(--text-muted);margin-top:2px;position:relative}
.board{max-width:1200px;margin:0 auto;padding:0 24px 32px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;position:relative;z-index:1}
.column{background:var(--card-bg);backdrop-filter:blur(8px);border-radius:var(--radius);border:1px solid var(--card-border);overflow:hidden}
.col-header{padding:14px 16px;font-size:14px;font-weight:600;border-bottom:1px solid var(--card-border);display:flex;align-items:center;gap:8px}
.col-header .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.col-todo .col-header{color:var(--blue)}
.col-todo .col-header .dot{background:var(--blue)}
.col-doing .col-header{color:var(--orange)}
.col-doing .col-header .dot{background:var(--orange)}
.col-done .col-header{color:var(--accent)}
.col-done .col-header .dot{background:var(--accent)}
.col-body{padding:8px;min-height:200px}
.card{background:#fff;border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:.15s;position:relative}
.card:hover{border-color:rgba(92,170,78,.25);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card .title{font-size:13px;font-weight:500}
.card .meta{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.card .meta .tag{font-size:9px;padding:2px 8px;border-radius:8px;background:rgba(92,170,78,.06);color:var(--text-muted)}
.card .meta .tag.pending{background:rgba(212,131,90,.1);color:var(--orange)}
.card .meta .tag.approved{background:rgba(59,139,46,.1);color:var(--accent)}
.card .meta .tag.rejected{background:rgba(200,106,106,.1);color:var(--red)}
.card .approval-badge{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 8px;border-radius:8px}
.card .approval-badge.pending{background:var(--orange);color:#fff;animation:pulse 1.5s infinite}
.card .approval-badge.approved{background:var(--accent);color:#fff}
.card .approval-badge.rejected{background:var(--red);color:#fff}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:80vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h2{font-size:17px;margin-bottom:2px}
.modal .phase-badge{display:inline-block;font-size:10px;padding:2px 10px;border-radius:10px;background:rgba(92,170,78,.06);color:var(--text-muted);margin-bottom:10px}
.modal label{display:block;font-size:12px;font-weight:500;margin:10px 0 4px;color:var(--text-dark)}
.modal input,.modal textarea,.modal select{width:100%;padding:9px 12px;border:1px solid var(--card-border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;background:#fafcfa;transition:.2s}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px rgba(92,170,78,.08)}
.modal textarea{resize:vertical;min-height:50px}
.modal .btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal .btns button{flex:1;min-width:70px;padding:9px;border:none;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;font-weight:500}
.modal .btn-primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 2px 8px rgba(59,139,46,.15)}
.modal .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(59,139,46,.2)}
.modal .btn-danger{background:#fff2f2;color:var(--red);border:1px solid #fdd}
.modal .btn-danger:hover{background:#fee}
.modal .btn-success{background:#f0faf0;color:var(--accent);border:1px solid #d0f0d0}
.modal .btn-success:hover{background:#e0f5e0}
.modal .btn-ghost{background:#f5f5f0;color:var(--text-dark)}
.modal .btn-ghost:hover{background:#e8e8e0}
.sub-list{margin:8px 0}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid rgba(92,170,78,.06)}
.sub-row:last-child{border-bottom:none}
.sub-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.sub-row .sub-text{flex:1;font-size:12px}
.sub-row .sub-text.done{text-decoration:line-through;color:var(--text-muted)}
.sub-row .result-input{flex:1;padding:4px 8px;border:none;border-bottom:1px dashed rgba(92,170,78,.15);background:transparent;font-size:11px;outline:none;color:var(--text-dark);transition:.2s}
.sub-row .result-input:focus{border-bottom-color:var(--accent2)}
.sub-row .result-input::placeholder{color:#c0dcc0}
.approval-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--card-border)}
.approval-section h3{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:4px}
.approval-status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:6px}
.approval-status.pending{background:rgba(212,131,90,.08);color:var(--orange)}
.approval-status.approved{background:rgba(59,139,46,.08);color:var(--accent)}
.approval-status.rejected{background:rgba(200,106,106,.08);color:var(--red)}
.approval-status.none{background:rgba(92,170,78,.04);color:var(--text-muted)}
.approval-msg{font-size:11px;color:var(--text-muted);margin:4px 0 8px;padding:8px;background:#fafcfa;border-radius:6px}
@media(max-width:800px){
  .board{grid-template-columns:1fr}
  .phase-flow{flex-wrap:wrap}
  .phase-item{min-width:70px}
  .stats-bar{gap:8px}
  .stat-card{min-width:60px;padding:8px 12px}
  .stat-card .num{font-size:18px}
}
</style>
</head>
<body>
<div class="animals"><span>🐐</span><span>🐏</span><span>🐄</span><span>🐎</span><span>🐑</span><span>🦅</span><span>🐪</span><span>🐃</span></div>
<header>
<div class="header-inner">
<div class="brand"><span class="logo">🐐</span><div class="txt"><h1>景甜 · 内蒙古特产</h1><small>拼多多电商运营</small></div></div>
<div class="header-info">
<span class="badge" id="phaseCount">6阶段</span>
<span class="badge approval" id="approvalBadge" style="display:none">⏳ 待审批</span>
<button class="btn-hdr" onclick="exportData()">📥 导出</button>
<button class="btn-hdr" onclick="document.getElementById('importFile').click()">📤 导入</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div></div></header>
<div class="stats-bar">
<div class="stat-card c1"><div class="num" id="statTodo">0</div><div class="label">待办</div></div>
<div class="stat-card c2"><div class="num" id="statDoing">0</div><div class="label">进行中</div></div>
<div class="stat-card c3"><div class="num" id="statDone">0</div><div class="label">已完成</div></div>
<div class="stat-card c4"><div class="num" id="statTotal">0</div><div class="label">总计</div></div>
</div>
<div class="flow-container"><div class="phase-flow" id="phaseFlow"></div></div>
<div class="board">
<div class="column col-todo"><div class="col-header"><span class="dot"></span> 待办 <span id="todoCount">(0)</span></div><div class="col-body" id="colTodo"></div></div>
<div class="column col-doing"><div class="col-header"><span class="dot"></span> 进行中 <span id="doingCount">(0)</span></div><div class="col-body" id="colDoing"></div></div>
<div class="column col-done"><div class="col-header"><span class="dot"></span> 已完成 <span id="doneCount">(0)</span></div><div class="col-body" id="colDone"></div></div>
</div>
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<h2 id="modalTitle">任务</h2>
<div class="phase-badge" id="modalPhase"></div>
<label>任务名称</label><input id="editName" placeholder="输入任务名称">
<label>状态</label><select id="editStatus"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select>
<label>阶段</label><select id="editPhase"></select>
<label>备注</label><textarea id="editNote" placeholder="备注…"></textarea>
<label>子任务</label>
<div class="sub-list" id="subList"><div style="color:var(--text-muted);font-size:12px;padding:4px 0">暂无子任务</div></div>
<div class="approval-section">
<h3>📋 审批</h3>
<div id="approvalStatusDisplay"></div>
<div id="approvalMessageDisplay"></div>
<div id="approvalActions" style="display:flex;gap:8px;margin-top:6px">
<button class="btn-primary" id="btnRequestApproval" onclick="ra()">📩 提交审批</button>
</div></div>
<div class="btns">
<button class="btn-primary" onclick="svt()">💾 保存</button>
<button class="btn-danger" onclick="del()">🗑 删除</button>
<button class="btn-ghost" onclick="cm()">取消</button>
</div></div></div>
<script>
const P=["准备","注册","选品","素材","上架","客服"],PC=["#5B9BD5","#A78BDB","#D4835A","#C86A6A","#7DB356","#C58B5C"],PI=["📋","📝","🔍","🎨","🚀","💬"];
let eid=null,data=ld();
function df(){return{tasks:[
{id:"t1",title:"准备注册资料",phase:"准备",status:"done",note:"身份证已拍照、手机号182xxx、工行卡已准备",subs:[{text:"身份证拍照",done:true,result:"已拍照"},{text:"手机号验证",done:true,result:"182xxx"},{text:"银行卡准备",done:true,result:"工行卡已准备"},{text:"备用店名确认",done:true,result:"原上草集"}],approval:{state:"approved",msg:"资料齐全",time:"04:30"}},
{id:"t2",title:"安装Python环境",phase:"准备",status:"done",note:"Python 3.11.5 + pillow/rembg",subs:[{text:"安装Python",done:true,result:"3.11.5"},{text:"安装pillow",done:true,result:"已安装"},{text:"测试通过",done:true,result:"ok"}],approval:{state:"approved",msg:"环境就绪",time:"04:30"}},
{id:"t3",title:"逛1688找供应商",phase:"选品",status:"doing",note:"找牛肉干/奶制品供应商",subs:[{text:"搜索牛肉干",done:true,result:"已搜索3家"},{text:"搜索奶制品",done:false},{text:"对比价格",done:false},{text:"联系询价",done:false}],approval:{state:"none"}},
{id:"t4",title:"确定选品清单",phase:"选品",status:"todo",note:"",subs:[],approval:{state:"none"}},
{id:"t5",title:"下载原图素材",phase:"素材",status:"todo",note:"从供应商拿图",subs:[],approval:{state:"none"}},
{id:"t6",title:"设计Logo与品牌色",phase:"素材",status:"todo",note:"",subs:[],approval:{state:"none"}},
{id:"t7",title:"注册拼多多店铺",phase:"注册",status:"todo",note:"商标: 原上草集",subs:[],approval:{state:"none"}},
{id:"t8",title:"上传商品",phase:"上架",status:"todo",note:"",subs:[],approval:{state:"none"}},
{id:"t9",title:"编写商品详情页",phase:"上架",status:"todo",note:"",subs:[],approval:{state:"none"}},
{id:"t10",title:"配置客服话术",phase:"客服",status:"todo",note:"",subs:[],approval:{state:"none"}},
{id:"t11",title:"运营推广",phase:"运营",status:"todo",note:"内容运营/社交推广",subs:[{text:"内容规划",done:false},{text:"社交推广",done:false}],approval:{state:"none"}}
]}}
function ld(){try{const r=localStorage.getItem("mg_kanban");if(r)return JSON.parse(r)}catch(e){}return df()}
function sv(){localStorage.setItem("mg_kanban",JSON.stringify(data));rn()}
function exp(){const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="内蒙古特产看板.json";a.click();URL.revokeObjectURL(a.href)}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{data=JSON.parse(ev.target.result);sv()}catch(e){alert("导入失败")}};r.readAsText(f)}
function rn(){const ts=data.tasks;const td=ts.filter(t=>t.status==="todo").length;const dg=ts.filter(t=>t.status==="doing").length;const dn=ts.filter(t=>t.status==="done").length;
document.getElementById("statTodo").textContent=td;document.getElementById("statDoing").textContent=dg;document.getElementById("statDone").textContent=dn;document.getElementById("statTotal").textContent=ts.length;
const pa=ts.filter(t=>t.approval&&t.approval.state==="pending");const bdg=document.getElementById("approvalBadge");bdg.style.display=pa.length?"inline":"none";if(pa.length)bdg.textContent=`⏳ ${pa.length}个待审批`;
const pf=document.getElementById("phaseFlow");pf.innerHTML=P.map((p,i)=>{const pt=ts.filter(t=>t.phase===p);const d=pt.filter(t=>t.status==="done").length;const tl=pt.length;const pc=tl?Math.round(d/tl*100):0;return'<div class="phase-item" onclick="fp(\''+p+'\')" data-phase="'+p+'"><div class="pbg" style="width:'+pc+'%;background:'+PC[i]+'"></div><div class="name">'+PI[i]+' '+p+'</div><div class="progress"><div class="bar"><div class="fill" style="width:'+pc+'%;background:'+PC[i]+'"></div></div><span class="pct">'+pc+'%</span></div><div class="count">'+d+'/'+tl+'</div></div>'}).join("");rc()}
let af=null;
function rc(){const ts=data.tasks;const fi=af?ts.filter(t=>t.phase===af):ts;
["todo","doing","done"].forEach(st=>{const el=document.getElementById(st==="todo"?"colTodo":st==="doing"?"colDoing":"colDone");const sts=fi.filter(t=>t.status===st);el.innerHTML=sts.map(t=>{const sd=t.subs.filter(s=>s.done).length;const stl=t.subs.length;const ap=t.approval||{state:"none"};let bh="";if(ap.state==="pending")bh='<div class="approval-badge pending">⏳</div>';else if(ap.state==="approved")bh='<div class="approval-badge approved">✅</div>';else if(ap.state==="rejected")bh='<div class="approval-badge rejected">❌</div>';return '<div class="card" onclick="ot(\''+t.id+'\')">'+bh+'<div class="title">'+es(t.title)+'</div><div class="meta"><span class="tag">'+t.phase+'</span>'+(stl?'<span class="tag">✓ '+sd+'/'+stl+'</span>':'')+(ap.state==="pending"?'<span class="tag pending">⏳审批</span>':'')+(ap.state==="approved"?'<span class="tag approved">✅审批</span>':'')+(ap.state==="rejected"?'<span class="tag rejected">❌审批</span>':'')+'</div></div>'}).join("")})}
function fp(p){document.querySelectorAll(".phase-item").forEach(el=>el.classList.remove("active"));const el=document.querySelector('.phase-item[data-phase="'+p+'"]');if(el)el.classList.add("active");af=(af===p)?null:p;rc()}
function ot(id){const t=data.tasks.find(x=>x.id===id);if(!t)return;eid=id;
document.getElementById("modalTitle").textContent=t.title;document.getElementById("editName").value=t.title;document.getElementById("editStatus").value=t.status;
const ep=document.getElementById("editPhase");ep.innerHTML=P.map(p=>'<option value="'+p+'"'+(p===t.phase?'selected':'')+'>'+p+'</option>').join("");
document.getElementById("editNote").value=t.note||"";document.getElementById("modalPhase").textContent=t.phase;
const sl=document.getElementById("subList");if(!t.subs||!t.subs.length){sl.innerHTML='<div style="color:var(--text-muted);font-size:12px;padding:4px 0">暂无子任务</div>'}else{sl.innerHTML=t.subs.map((s,i)=>'<div class="sub-row"><input type="checkbox"'+(s.done?" checked":"")+' onchange="ts('+i+')"><span class="sub-text'+(s.done?' done':'')+'">'+es(s.text)+'</span><input class="result-input" value="'+es(s.result||"")+'" placeholder="结果..." onchange="sr('+i+',this.value)"></div>').join("")}
const ap=t.approval||{state:"none",msg:"",time:""};const asd=document.getElementById("approvalStatusDisplay");const amd=document.getElementById("approvalMessageDisplay");const bnt=document.getElementById("btnRequestApproval");
if(ap.state==="none"){asd.className="approval-status none";asd.textContent="📋 未提交审批";amd.textContent="";bnt.style.display="block"}else if(ap.state==="pending"){asd.className="approval-status pending";asd.textContent="⏳ 审批中… 已发送到手机";amd.textContent="提交时间: "+(ap.time||"—");bnt.style.display="none"}else if(ap.state==="approved"){asd.className="approval-status approved";asd.textContent="✅ 审批已通过";amd.textContent=(ap.msg?"回复: "+ap.msg:"")+(ap.time?" · "+ap.time:"");bnt.style.display="none"}else{asd.className="approval-status rejected";asd.textContent="❌ 审批已拒绝";amd.textContent=(ap.msg?"回复: "+ap.msg:"")+(ap.time?" · "+ap.time:"");bnt.style.display="none"}
document.getElementById("modalOverlay").classList.add("show")}
function cm(){document.getElementById("modalOverlay").classList.remove("show");eid=null}
function ts(idx){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.subs[idx].done=!t.subs[idx].done;sv();ot(eid)}
function sr(idx,val){const t=data.tasks.find(x=>x.id===eid);if(!t)return;if(!t.subs[idx].result)t.subs[idx].result="";t.subs[idx].result=val;sv()}
function svt(){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.title=document.getElementById("editName").value.trim()||t.title;t.status=document.getElementById("editStatus").value;t.phase=document.getElementById("editPhase").value;t.note=document.getElementById("editNote").value;sv();cm()}
function del(){if(!confirm("确定删除？"))return;data.tasks=data.tasks.filter(t=>t.id!==eid);sv();cm()}
function ra(){const t=data.tasks.find(x=>x.id===eid);if(!t)return;if(!t.approval)t.approval={state:"pending",msg:"",time:""};t.approval.state="pending";t.approval.time=new Date().toLocaleString("zh-CN");sv();ot(eid)}
function es(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
rn();
</script>
</body>
