<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景甜 · 内蒙古特产 · 拼多多运营</title>
<style>
:root {
  --green: #00b451;
  --green-dark: #009940;
  --green-light: #e6f7ec;
  --green-bg: #f0faf5;
  --text: #333;
  --text-light: #707070;
  --text-muted: #999;
  --bg: #f8faf8;
  --card: #fff;
  --border: #e8e8e0;
  --shadow: 0 2px 16px rgba(0,180,81,0.08);
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  -webkit-font-smoothing:antialiased
}

/* Header */
header{
  background:#fff;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;height:60px
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:24px}
.brand .txt h1{font-size:18px;font-weight:600}
.brand .txt h1 span{color:var(--green)}
.brand .txt small{font-size:11px;color:var(--text-light);display:block;margin-top:-1px}
.header-nav{display:flex;align-items:center;gap:8px}
.header-nav .btn-sm-outline{
  background:transparent;color:var(--text-light);border:1px solid var(--border);
  padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s;font-family:inherit
}
.header-nav .btn-sm-outline:hover{border-color:var(--green);color:var(--green)}

/* Main */
.main{max-width:1200px;margin:0 auto;padding:20px 24px 40px}

/* ===== 总进度条 ===== */
.overall{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px 28px;margin-bottom:20px
}
.overall-top{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px
}
.overall-title{font-size:15px;font-weight:600}
.overall-title span{color:var(--green)}
.overall-pct{
  font-size:28px;font-weight:700;color:var(--green);line-height:1
}
.overall-bar{
  height:8px;background:#e8e8e0;border-radius:4px;overflow:hidden;margin-bottom:10px
}
.overall-bar .fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--green-light),var(--green));
  transition:width .8s ease;position:relative
}
.overall-bar .fill::after{
  content:'';position:absolute;top:0;right:0;width:20px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));
  border-radius:0 4px 4px 0
}
.overall-meta{
  display:flex;justify-content:space-between;font-size:12px;color:var(--text-light)
}
.overall-meta .info{display:flex;gap:16px;flex-wrap:wrap}
.overall-meta .info span{display:flex;align-items:center;gap:4px}
.overall-meta .info .dot{
  display:inline-block;width:6px;height:6px;border-radius:50%
}
.overall-meta .info .dot.g{background:var(--green)}
.overall-meta .info .dot.o{background:#e67e22}
.overall-meta .info .dot.r{background:#c0392b}
.overall-meta .info .dot.b{background:#2980b9}

/* Stats row - 优化后4个简约卡片 */
.stats-row{display:flex;gap:12px;margin-bottom:20px}
.stat-box{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 20px;flex:1;min-width:0;transition:.2s
}
.stat-box:hover{border-color:var(--green);box-shadow:var(--shadow)}
.stat-box .num{font-size:26px;font-weight:700}
.stat-box .label{font-size:12px;color:var(--text-light);margin-top:2px}
.stat-box.s1 .num{color:var(--green)}
.stat-box.s2 .num{color:#e67e22}
.stat-box.s3 .num{color:#2980b9}
.stat-box.s4 .num{color:var(--text-muted)}

/* Phase bar - 带小进度条 */
.phase-bar{display:flex;gap:0;margin-bottom:20px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden
}
.phase-item{
  flex:1;padding:14px 12px;text-align:center;cursor:pointer;
  transition:.2s;position:relative;border-right:1px solid var(--border)
}
.phase-item:last-child{border-right:none}
.phase-item:hover{background:var(--green-light)}
.phase-item.active{background:var(--green-light)}
.phase-item.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:3px;background:var(--green);border-radius:3px 3px 0 0
}
.phase-item .icon{font-size:20px}
.phase-item .name{font-size:13px;font-weight:500;margin-top:4px}
.phase-item .meta{font-size:11px;color:var(--text-light);margin-top:2px}
.phase-item .mini-bar{
  height:3px;background:#e8e8e0;border-radius:2px;margin-top:6px;overflow:hidden
}
.phase-item .mini-bar .mf{
  height:100%;border-radius:2px;transition:width .5s
}

/* Board */
.board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px}
.column{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden
}
.col-header{
  padding:12px 16px;font-size:13px;font-weight:600;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px
}
.col-header .num{font-size:11px;color:var(--text-muted);font-weight:400}
.col-body{padding:8px;min-height:80px}

/* Card */
.card{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;
  cursor:pointer;transition:.15s
}
.card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(0,180,81,.06)}
.card .title{font-size:13px;font-weight:500;line-height:1.4}
.card .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.card .tag{
  font-size:10px;padding:2px 8px;border-radius:4px;
  background:#f5f5f0;color:var(--text-light)
}
.card .tag.green{background:var(--green-light);color:var(--green)}
.card .tag.orange{background:#fef3e2;color:#e67e22}
.card .tag.gray{background:#f0f0ec;color:var(--text-muted)}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:480px;
  max-height:80vh;overflow-y:auto;padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.12)
}
.modal .modal-h{font-size:17px;font-weight:600;margin-bottom:2px}
.modal .modal-sub{font-size:12px;color:var(--text-light);margin-bottom:14px}
.modal label{display:block;font-size:12px;font-weight:500;margin:10px 0 4px}
.modal input,.modal textarea,.modal select{
  width:100%;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);font-size:13px;outline:none;
  font-family:inherit;background:#fafcfa;transition:.2s
}
.modal input:focus,.modal textarea:focus,.modal select:focus{
  border-color:var(--green);background:#fff;box-shadow:0 0 0 3px rgba(0,180,81,.06)
}
.modal textarea{resize:vertical;min-height:50px}
.modal .btn-row{display:flex;gap:8px;margin-top:14px}
.modal .btn-row button{
  flex:1;padding:10px;border:none;border-radius:var(--radius-sm);
  font-size:13px;cursor:pointer;transition:.2s;font-family:inherit;font-weight:500
}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-danger{background:#fff2f2;color:#c0392b;border:1px solid #fdd}
.btn-ghost{background:#f5f5f0;color:var(--text)}
.sub-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0f0eb}
.sub-row input[type=checkbox]{width:15px;height:15px;accent-color:var(--green);cursor:pointer}
.sub-row .sub-text{flex:1;font-size:12px}
.sub-row .sub-text.done{text-decoration:line-through;color:var(--text-muted)}
.sub-row .result-inp{
  flex:1;padding:4px 8px;border:none;border-bottom:1px dashed #ddd;
  background:transparent;font-size:11px;outline:none;transition:.2s
}
.sub-row .result-inp:focus{border-bottom-color:var(--green)}
.sub-row .result-inp::placeholder{color:#ccc}

@media(max-width:768px){
  .board{grid-template-columns:1fr}
  .stats-row{flex-wrap:wrap}
  .stat-box{min-width:100px}
  .phase-bar{flex-wrap:wrap}
  .phase-item{min-width:80px;border-bottom:1px solid var(--border)}
  .overall{padding:18px 20px}
  .overall-pct{font-size:22px}
}
</style>
</head>
<body>

<header>
<div class="header-inner">
<div class="brand"><span class="logo">🐐</span><div class="txt"><h1>景甜 · <span>内蒙古特产</span></h1><small>拼多多电商运营</small></div></div>
<div class="header-nav">
<span class="btn-sm-outline" onclick="exportData()">📥 导出</span>
<span class="btn-sm-outline" onclick="document.getElementById('importFile').click()">📤 导入</span>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
</div>
</div>
</header>

<div class="main">

<!-- 总进度条 -->
<div class="overall">
<div class="overall-top">
<div class="overall-title">📈 项目总进度 <span id="overallPctText">0%</span></div>
<div class="overall-pct" id="overallPctNum">0%</div>
</div>
<div class="overall-bar"><div class="fill" id="overallBarFill" style="width:0%"></div></div>
<div class="overall-meta">
<div class="info">
<span id="overallTasks">📋 0个任务</span>
<span id="overallDoneTasks">✅ 0已完成</span>
<span id="overallPhaseInfo">📊 0/6阶段</span>
</div>
<div class="info">
<span id="overallDateInfo">📅 项目进行中</span>
</div>
</div>
</div>

<!-- 统计卡片 -->
<div class="stats-row" id="statsRow"></div>

<!-- 阶段进度 -->
<div class="phase-bar" id="phaseBar"></div>

<!-- 看板三列 -->
<div class="board">
<div class="column">
<div class="col-header"><span style="color:var(--green)">●</span> 待办 <span class="num" id="todoC">0</span></div>
<div class="col-body" id="colTodo"></div>
</div>
<div class="column">
<div class="col-header"><span style="color:#e67e22">●</span> 进行中 <span class="num" id="doingC">0</span></div>
<div class="col-body" id="colDoing"></div>
</div>
<div class="column">
<div class="col-header"><span style="color:#2980b9">●</span> 已完成 <span class="num" id="doneC">0</span></div>
<div class="col-body" id="colDone"></div>
</div>
</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal">
<div class="modal-h" id="modalTitle">任务</div>
<div class="modal-sub" id="modalSub"></div>
<label>任务名称</label><input id="editName">
<label>状态</label>
<select id="editStatus"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select>
<label>阶段</label><select id="editPhase"></select>
<label>备注</label><textarea id="editNote"></textarea>
<label>子任务</label>
<div id="subList"></div>
<div class="btn-row">
<button class="btn-primary" onclick="save()">💾 保存</button>
<button class="btn-danger" onclick="del()">🗑 删除</button>
<button class="btn-ghost" onclick="closeModal()">取消</button>
</div>
</div>
</div>

<script>
const PHASES=["准备","注册","选品","素材","上架","客服"];
const PI=["📋","📝","🔍","🎨","🚀","💬"];
let eid=null,data=ld(),af=null;

function df(){return{tasks:[
{id:"t1",title:"准备注册资料",phase:"准备",status:"done",note:"身份证已拍照、手机号182xxx、工行卡已准备",subs:[{text:"身份证拍照",done:true,result:"已拍照"},{text:"手机号验证",done:true,result:"182xxx"},{text:"银行卡准备",done:true,result:"工行卡已准备"},{text:"备用店名确认",done:true,result:"原上草集"}]},
{id:"t2",title:"安装Python环境",phase:"准备",status:"done",note:"Python3.11.5+pillow/rembg",subs:[{text:"安装Python",done:true,result:"3.11.5"},{text:"安装pillow",done:true,result:"已安装"},{text:"测试通过",done:true,result:"ok"}]},
{id:"t3",title:"逛1688找供应商",phase:"选品",status:"doing",note:"找牛肉干/奶制品供应商",subs:[{text:"搜索牛肉干",done:true,result:"已搜索3家"},{text:"搜索奶制品",done:false},{text:"对比价格",done:false},{text:"联系询价",done:false}]},
{id:"t4",title:"确定选品清单",phase:"选品",status:"todo",note:"",subs:[]},{id:"t5",title:"下载原图素材",phase:"素材",status:"todo",note:"从供应商拿图",subs:[]},{id:"t6",title:"设计Logo与品牌色",phase:"素材",status:"todo",note:"",subs:[]},{id:"t7",title:"注册拼多多店铺",phase:"注册",status:"todo",note:"商标:原上草集",subs:[]},{id:"t8",title:"上传商品",phase:"上架",status:"todo",note:"",subs:[]},{id:"t9",title:"编写商品详情页",phase:"上架",status:"todo",note:"",subs:[]},{id:"t10",title:"配置客服话术",phase:"客服",status:"todo",note:"",subs:[]},{id:"t11",title:"运营推广",phase:"运营",status:"todo",note:"内容运营/社交推广",subs:[{text:"内容规划",done:false},{text:"社交推广",done:false}]}],startDate:"2026-04-24",targetDate:"2026-05-15"}}
function ld(){console.log("加载看板数据...");try{const k="mg_kanban";const oldKeys=["kb_v9","kb_v8","kb_v3"];const r=localStorage.getItem(k);if(r){console.log("找到",k);return JSON.parse(r)}for(let ok of oldKeys){const o=localStorage.getItem(ok);if(o){try{const d=JSON.parse(o);if(d&&d.tasks){console.log("旧数据迁移",ok);localStorage.setItem(k,JSON.stringify(d));return d}}catch{}}}console.log("无数据，使用默认");const def=df();localStorage.setItem(k,JSON.stringify(def));return def}catch(e){console.error("ld错误",e);const def=df();try{localStorage.setItem("mg_kanban",JSON.stringify(def))}catch{}return def}}
function sv(){localStorage.setItem("mg_kanban",JSON.stringify(data));rn()}
function exp(){const b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="内蒙古特产看板.json";a.click();URL.revokeObjectURL(a.href)}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{data=JSON.parse(ev.target.result);sv()}catch{alert("导入失败:格式错误")}};r.readAsText(f)}

function calcOverall(){
  const t=data.tasks;
  // 任务完成率
  const total=t.length,done=t.filter(x=>x.status==="done").length;
  const taskPct=total?Math.round(done/total*100):0;
  // 阶段完成率：每个阶段全部done=1分
  const phasesDone=PHASES.reduce((c,p)=>{const pt=t.filter(x=>x.phase===p);return c+(pt.length&&pt.every(x=>x.status==="done")?1:0)},0);
  const phasePct=Math.round(phasesDone/PHASES.length*100);
  // 日期进度
  const sd=data.startDate||(data.__startDate||"2026-04-24"),td=data.targetDate||(data.__targetDate||"2026-05-15");
  const s=new Date(sd),e=new Date(td),n=new Date();
  const totalDays=Math.max(1,(e-s)/(864e5));
  const elapsed=Math.max(0,Math.min(totalDays,(n-s)/(864e5)));
  const datePct=Math.round(elapsed/totalDays*100);
  // 综合 = 任务40% + 阶段40% + 日期20%
  const pct=Math.round(taskPct*0.4+phasePct*0.4+datePct*0.2);
  return{pct,taskPct,phasePct,datePct,total,done,phasesDone,totalPhases:PHASES.length,sd,td,elapsed:Math.round(elapsed),totalDays:Math.round(totalDays)}
}

function rn(){
  const t=data.tasks;
  const o=calcOverall();
  // 总进度条
  document.getElementById("overallPctText").textContent=o.pct+"%";
  document.getElementById("overallPctNum").textContent=o.pct+"%";
  document.getElementById("overallBarFill").style.width=o.pct+"%";
  document.getElementById("overallTasks").innerHTML="📋 "+o.total+"个任务";
  document.getElementById("overallDoneTasks").innerHTML="✅ "+o.done+"已完成";
  document.getElementById("overallPhaseInfo").innerHTML="📊 "+o.phasesDone+"/"+o.totalPhases+"阶段";
  document.getElementById("overallDateInfo").innerHTML="📅 "+o.sd+" → "+o.td+"（第"+o.elapsed+"/"+o.totalDays+"天）";

  // Stats
  const todo=t.filter(x=>x.status==="todo").length;
  const doing=t.filter(x=>x.status==="doing").length;
  const done=t.filter(x=>x.status==="done").length;
  document.getElementById("statsRow").innerHTML=[
    {n:todo,l:"待办",c:"s2"},{n:doing,l:"进行中",c:"s1"},{n:done,l:"已完成",c:"s3"},{n:t.length,l:"总计",c:"s4"}
  ].map(s=>`<div class="stat-box ${s.c}"><div class="num">${s.n}</div><div class="label">${s.l}</div></div>`).join("");

  // Phase bar
  document.getElementById("phaseBar").innerHTML=PHASES.map((p,i)=>{
    const pt=t.filter(x=>x.phase===p),d=pt.filter(x=>x.status==="done").length,tl=pt.length;
    const pct=tl?Math.round(d/tl*100):0;
    const baseColor=["#5B9BD5","#A78BDB","#D4835A","#C86A6A","#7DB356","#C58B5C"][i];
    return '<div class="phase-item'+(af===p?' active':'')+'" onclick="fp(\''+p+'\')">'+
      '<div class="icon">'+PI[i]+'</div>'+
      '<div class="name">'+p+'</div>'+
      '<div class="meta">'+d+'/'+tl+'</div>'+
      '<div class="mini-bar"><div class="mf" style="width:'+pct+'%;background:'+baseColor+'"></div></div>'+
      '</div>';
  }).join("");
  rc();
}

function rc(){
  const t=data.tasks;
  // 应用阶段筛选
  const fi=af?t.filter(x=>x.phase===af):t;
  ["todo","doing","done"].forEach(st=>{
    const colId={todo:"colTodo",doing:"colDoing",done:"colDone"}[st];
    const el=document.getElementById(colId);
    const items=fi.filter(x=>x.status===st);
    el.innerHTML=items.map(x=>{
      const sdc=x.subs.filter(s=>s.done).length,sdl=x.subs.length;
      let tags='<span class="tag">'+x.phase+'</span>';
      if(sdl)tags+='<span class="tag green">✓'+sdc+'/'+sdl+'</span>';
      return '<div class="card" onclick="ot(\''+x.id+'\')"><div class="title">'+esc(x.title)+'</div><div class="tags">'+tags+'</div></div>';
    }).join("");
  });
  document.getElementById("todoC").textContent=fi.filter(x=>x.status==="todo").length;
  document.getElementById("doingC").textContent=fi.filter(x=>x.status==="doing").length;
  document.getElementById("doneC").textContent=fi.filter(x=>x.status==="done").length;
}

function fp(p){
  const items=document.querySelectorAll(".phase-item");
  if(af===p){af=null;items.forEach(el=>el.classList.remove("active"))}
  else{items.forEach(el=>el.classList.remove("active"));af=p;items.forEach(el=>{if(el.textContent.includes(p))el.classList.add("active")})}
  rc()
}
function fp(p){af=(af===p)?null:p;const items=document.querySelectorAll(".phase-item");items.forEach(el=>el.classList.remove("active"));items.forEach(el=>{if(el.textContent.includes(af||"__none__"))el.classList.add("active")});rc()}

function ot(id){
  const t=data.tasks.find(x=>x.id===id);if(!t)return;eid=id;
  document.getElementById("modalTitle").textContent=t.title;
  document.getElementById("editName").value=t.title;
  document.getElementById("editStatus").value=t.status;
  document.getElementById("editPhase").innerHTML=PHASES.map(p=>'<option value="'+p+'"'+(p===t.phase?'selected':'')+'>'+p+'</option>').join("");
  document.getElementById("editNote").value=t.note||"";
  const sdc=t.subs.filter(s=>s.done).length,sdl=t.subs.length;
  document.getElementById("modalSub").textContent=t.phase+(sdl?" · 子任务 "+sdc+"/"+sdl:"");
  const sl=document.getElementById("subList");
  if(!t.subs||!t.subs.length){t.subs=[];sl.innerHTML='<div style="font-size:12px;color:var(--text-muted);padding:4px 0">暂无子任务</div>'}
  sl.innerHTML=t.subs.map((s,i)=>'<div class="sub-row"><input type="checkbox"'+(s.done?" checked":"")+' onchange="ts('+i+')"><span class="sub-text'+(s.done?" done":"")+'">'+esc(s.text)+'</span><input class="result-inp" value="'+esc(s.result||"")+'" placeholder="结果" onchange="sr('+i+',this.value)"><span onclick="delSub('+i+')" style="color:#999;cursor:pointer;font-size:14px;line-height:1">×</span></div>').join("")+
      '<div style="display:flex;gap:6px;margin-top:6px"><input id="newSubInput" placeholder="新增子任务…" style="flex:1;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none"><button onclick="addSub()" style="border:none;background:var(--green);color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit">+ 添加</button></div>'}
  document.getElementById("modalOverlay").classList.add("show");
}
function cm(){document.getElementById("modalOverlay").classList.remove("show");rn();eid=null}
function addSub(){const t=data.tasks.find(x=>x.id===eid);if(!t)return;const inp=document.getElementById("newSubInput");const txt=inp.value.trim();if(!txt)return;if(!t.subs)t.subs=[];t.subs.push({text:txt,done:false,result:""});sv();ot(eid)}
function delSub(i){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.subs.splice(i,1);sv();ot(eid)}
function ts(i){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.subs[i].done=!t.subs[i].done;sv();ot(eid)}
function sr(i,v){const t=data.tasks.find(x=>x.id===eid);if(!t)return;if(!t.subs[i].result)t.subs[i].result="";t.subs[i].result=v;sv()}
function save(){const t=data.tasks.find(x=>x.id===eid);if(!t)return;t.title=document.getElementById("editName").value.trim()||t.title;t.status=document.getElementById("editStatus").value;t.phase=document.getElementById("editPhase").value;t.note=document.getElementById("editNote").value;sv();cm()}
function del(){if(!confirm("确定删除此任务？"))return;data.tasks=data.tasks.filter(t=>t.id!==eid);sv();cm()}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
rn();
</script>
</body>
</html>
